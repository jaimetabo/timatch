name: Deploy auf STRATO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, was passieren würde (nichts übertragen)'
        type: boolean
        default: false

# STRATO drosselt die SSH-Verbindungsrate — niemals zwei Deploys gleichzeitig.
concurrency:
  group: deploy-strato-timatch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.STRATO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.STRATO_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Dateien auf den Webspace übertragen
        env:
          HOST: ${{ secrets.STRATO_HOST }}
          USER: ${{ secrets.STRATO_USER }}
          TARGET: ${{ secrets.STRATO_PATH }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # --checksum: git checkout setzt frische mtimes, ein Zeitstempelvergleich
          # wuerde daher bei jedem Lauf alle Dateien neu uebertragen.
          # CNAME ist ein reines GitHub-Pages-Artefakt und gehoert nicht auf den Webspace.
          rsync -avz --checksum --delete $DRY \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'CNAME' \
            --exclude '.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o UpdateHostKeys=no -o StrictHostKeyChecking=yes" \
            ./ "$USER@$HOST:$TARGET"

      - name: Website erreichbar?
        if: ${{ !inputs.dry_run }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://timatch.jaimetaboada.com/)
          echo "HTTP-Status: $code"
          test "$code" = "200"
